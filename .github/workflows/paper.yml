name: paper-trading
on:
  schedule:
    - cron: "45 11 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python paper_daily.py
      - name: Save results to the repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add paper
          git diff --cached --quiet || git commit -m "paper: $(TZ=Asia/Kolkata date +%F)"
          git push
